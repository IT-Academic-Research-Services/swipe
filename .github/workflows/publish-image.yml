name: Publish swipe image to ECR

# Builds and publishes the swipe orchestrator image as a genuine multi-architecture
# (linux/amd64 + linux/arm64) manifest index in the dev ECR registry.
#
# This replaces push-docker-images.yml, which was (a) commented out in its entirety and
# had therefore never run once, and (b) aimed at ghcr.io rather than the ECR registry the
# Batch compute environments actually pull from. The practical consequence was that the
# only swipe image in dev ECR was hand-built and hand-pushed by a person, and was
# arm64-only while the user-facing Batch compute environments are r5d (x86_64) -- which
# took every user workflow down with CannotPullImageManifestError.
#
# Design notes:
#
#   * NATIVE ARM64 RUNNER, NO QEMU. The arm64 leg runs on `ubuntu-22.04-arm`. Building
#     arm64 under QEMU emulation on an x86 runner takes hours for an image of this shape
#     (apt + pip + several source installs) and is prone to job timeouts. This repository
#     is public, so GitHub-hosted arm64 runners are free; if it is ever made private, arm64
#     runner minutes bill at the standard 2-core Linux rate against the org's included
#     minutes, and the arm64 leg becomes a real (if modest) line item.
#
#   * REPOSITORY VARIABLE GATE, NOT `github.event.repository.fork`. GitHub reports the
#     canonical IT-Academic-Research-Services repositories as isFork=TRUE and the personal
#     thorvath-slower forks as FALSE, because the canonical repos were themselves forked
#     from upstream. A `fork == false` gate therefore disables the job on exactly the repo
#     where it must run, which is how seqtoid-workflows' image build silently never
#     published anything (see platform-overhaul 692 and seqtoid-workflows 35). This
#     workflow is gated on the explicit variable SWIPE_IMAGE_PUBLISH_ENABLED instead.
#     Set it to "true" on the canonical repository ONLY; forks leave it unset and skip.
#
#   * VERIFICATION IS A HARD GATE, IN TWO LAYERS.
#       - scripts/verify-multiarch-image.sh walks the published index down to each child's
#         CONFIG BLOB and fails the job if linux/amd64 and linux/arm64 are not both
#         genuinely present. An index's platform fields are unvalidated pusher-supplied
#         metadata; the config blob is what the container runtime reads.
#       - scripts/verify-image-binaries.sh then reads the ELF header of the
#         architecture-specific binaries INSIDE each child. A correct manifest and config
#         blob can still wrap amd64 binaries in an arm64 image (that is exactly what the
#         `ARG TARGETARCH=amd64` default did), and that image dies at runtime with
#         `exec format error`.
#     Both layers ship with a control that must FAIL: the manifest check is first run
#     against a known single-architecture tag and the job fails if it passes, and the ELF
#     check self-tests against synthetic headers and fails unless it rejects the mismatched
#     ones. A verification step that has quietly stopped verifying cannot ship green.

on:
  push:
    branches:
      - main
    # Releases are cut by pushing a version tag (v1.4.9-ucsf.10, ...). The ECR tag is then
    # exactly the git tag, so "which commit is this image" is answerable from the tag alone.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra ECR tag to publish this build under (e.g. v1.4.9-ucsf.10). Blank = commit-SHA tag only."
        required: false
        default: ""

env:
  AWS_REGION: us-west-2
  # Rotatable via repository/org Actions variables rather than hardcoded. Defaults are the
  # dev account and the sibling build role added in cypherid-web-infra alongside
  # czid-dev-gh-actions-workflows-build.
  CI_ACCOUNT_ID: ${{ vars.CI_ACCOUNT_ID || '491013321714' }}
  GHA_ROLE: ${{ vars.GHA_ROLE || 'czid-dev-gh-actions-swipe-build' }}
  ECR_REPO: swipe

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compute the tag set ONCE. Both architecture legs and the manifest publish consume it,
  # so the two per-architecture images provably land under the same tag instead of each leg
  # recomputing a value that could drift.
  resolve-tags:
    if: ${{ vars.SWIPE_IMAGE_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      version_tag: ${{ steps.tags.outputs.version_tag }}
      publish_latest: ${{ steps.tags.outputs.publish_latest }}
    steps:
      - id: tags
        env:
          # Through the environment, never interpolated into the script body: a
          # ${{ }} expansion is textual substitution into the shell source, so a tag or
          # input containing shell metacharacters would execute.
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA:0:8}"

          # Version tag, in priority order: an explicit workflow_dispatch input, else the
          # git tag being pushed. A plain push to main gets the SHA tag only -- main is not
          # a release, and silently moving a version tag is how images and manifests drift.
          VERSION_TAG="${INPUT_IMAGE_TAG:-}"
          if [ -z "${VERSION_TAG}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          fi

          PUBLISH_LATEST=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            PUBLISH_LATEST=true
          fi

          # Anything that reaches a docker tag must look like a docker tag. This is both a
          # correctness check (ECR rejects the rest anyway, late and confusingly) and the
          # backstop for the quoting note above.
          if [ -n "${VERSION_TAG}" ] && \
             ! printf '%s' "${VERSION_TAG}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::refusing to publish under an invalid image tag: ${VERSION_TAG}"
            exit 1
          fi

          {
            echo "sha_tag=${SHA_TAG}"
            echo "version_tag=${VERSION_TAG}"
            echo "publish_latest=${PUBLISH_LATEST}"
          } >> "$GITHUB_OUTPUT"

          echo "sha tag: ${SHA_TAG}"
          echo "version tag: ${VERSION_TAG:-<none>}"
          echo "publish latest: ${PUBLISH_LATEST}"

  build:
    needs: resolve-tags
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            # Native arm64 hardware. NOT QEMU: an emulated build of this image runs for
            # hours and times out.
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions: # required for the OIDC AssumeRole below
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: arn:aws:iam::${{ env.CI_ACCOUNT_ID }}:role/${{ env.GHA_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          registry: ${{ env.CI_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      # The default buildx driver is the plain docker driver, which cannot --push or emit
      # a single-platform manifest straight to a registry. This creates a docker-container
      # builder that can.
      - name: set up buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: build and push ${{ matrix.arch }} image
        env:
          ARCH: ${{ matrix.arch }}
          SHA_TAG: ${{ needs.resolve-tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          IMAGE_URI="${CI_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"

          # Per-architecture tags are published first and kept afterwards. They are the
          # inputs the manifest index is assembled from, and they remain as a provenance
          # and debugging trail ("was the arm64 leg actually built for this commit?").
          #
          # --provenance=false keeps each leg a plain single-platform manifest rather than
          # a one-entry index with an attestation child, so the index assembled below has
          # exactly two real children.
          #
          # Cache is best-effort off the previous per-arch latest; a miss is not an error.
          docker buildx build . \
            --file Dockerfile \
            --platform "linux/${ARCH}" \
            --provenance=false \
            --cache-from "type=registry,ref=${IMAGE_URI}:latest-${ARCH}" \
            --cache-to "type=inline" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "runnumber=${GITHUB_RUN_ID}" \
            --tag "${IMAGE_URI}:${SHA_TAG}-${ARCH}" \
            --push

          # Sanity check at the source: the leg that just ran on ${ARCH} hardware must have
          # produced an ${ARCH} image. If this is wrong the manifest verification later will
          # catch it too, but failing here points straight at the offending leg.
          BUILT_ARCH="$(docker buildx imagetools inspect --format '{{json .Image}}' \
            "${IMAGE_URI}:${SHA_TAG}-${ARCH}" | jq -r '.architecture')"
          if [ "${BUILT_ARCH}" != "${ARCH}" ]; then
            echo "::error::${IMAGE_URI}:${SHA_TAG}-${ARCH} reports architecture ${BUILT_ARCH}"
            exit 1
          fi

  publish-manifest:
    needs: [resolve-tags, build]
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: arn:aws:iam::${{ env.CI_ACCOUNT_ID }}:role/${{ env.GHA_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          registry: ${{ env.CI_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: set up buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: publish multi-arch manifest
        id: publish
        env:
          SHA_TAG: ${{ needs.resolve-tags.outputs.sha_tag }}
          VERSION_TAG: ${{ needs.resolve-tags.outputs.version_tag }}
          PUBLISH_LATEST: ${{ needs.resolve-tags.outputs.publish_latest }}
        run: |
          set -euo pipefail
          IMAGE_URI="${CI_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"

          SOURCES=("${IMAGE_URI}:${SHA_TAG}-amd64" "${IMAGE_URI}:${SHA_TAG}-arm64")

          # The commit-SHA index is always published: every build is addressable.
          docker buildx imagetools create -t "${IMAGE_URI}:${SHA_TAG}" "${SOURCES[@]}"

          if [ -n "${VERSION_TAG}" ]; then
            docker buildx imagetools create -t "${IMAGE_URI}:${VERSION_TAG}" "${SOURCES[@]}"
          fi
          if [ "${PUBLISH_LATEST}" = "true" ]; then
            docker buildx imagetools create -t "${IMAGE_URI}:latest" "${SOURCES[@]}"
            # Refresh the per-arch cache sources used by the next build.
            docker buildx imagetools create -t "${IMAGE_URI}:latest-amd64" "${IMAGE_URI}:${SHA_TAG}-amd64"
            docker buildx imagetools create -t "${IMAGE_URI}:latest-arm64" "${IMAGE_URI}:${SHA_TAG}-arm64"
          fi

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: verify every published tag genuinely carries both architectures
        env:
          IMAGE_URI: ${{ steps.publish.outputs.image_uri }}
          SHA_TAG: ${{ needs.resolve-tags.outputs.sha_tag }}
          VERSION_TAG: ${{ needs.resolve-tags.outputs.version_tag }}
          PUBLISH_LATEST: ${{ needs.resolve-tags.outputs.publish_latest }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-multiarch-image.sh

          # NEGATIVE CONTROL, first and deliberately. Run the verifier against a tag that is
          # known to be single-architecture (the arm64 leg's own per-arch tag). If the
          # verifier PASSES that, it is not verifying anything and every "OK" below would be
          # worthless -- so treat a passing negative control as a failure of this job.
          if scripts/verify-multiarch-image.sh "${ECR_REPO}" \
               "${IMAGE_URI}:${SHA_TAG}-arm64" linux/amd64 linux/arm64 > /tmp/negctl.log 2>&1; then
            cat /tmp/negctl.log
            echo "::error::negative control PASSED: verify-multiarch-image.sh accepted a known arm64-only image, so it is not actually checking architectures"
            exit 1
          fi
          echo "negative control correctly rejected the arm64-only tag:"
          tail -3 /tmp/negctl.log

          TAGS=("${SHA_TAG}")
          if [ -n "${VERSION_TAG}" ]; then TAGS+=("${VERSION_TAG}"); fi
          if [ "${PUBLISH_LATEST}" = "true" ]; then TAGS+=("latest"); fi

          for t in "${TAGS[@]}"; do
            scripts/verify-multiarch-image.sh "${ECR_REPO}" "${IMAGE_URI}:${t}" linux/amd64 linux/arm64
          done

      # The config blob is authoritative about what an image CLAIMS to be, but not about what
      # it CONTAINS. The Dockerfile fetches architecture-specific binaries keyed on
      # ${TARGETARCH}; when that ARG carried a default it shadowed BuildKit's injected value
      # and an arm64 build quietly pulled amd64 binaries -- a correct arm64 manifest and
      # config blob wrapped around an image that dies with `exec format error`. This step
      # reads the ELF header of those binaries inside each architecture's child image.
      - name: verify each architecture's binaries are actually that architecture
        env:
          IMAGE_URI: ${{ steps.publish.outputs.image_uri }}
          SHA_TAG: ${{ needs.resolve-tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-image-binaries.sh

          # Prove the ELF decoder still discriminates before trusting a single one of its
          # verdicts: it must accept matching architectures AND reject mismatched ones.
          scripts/verify-image-binaries.sh --self-test

          for platform in linux/amd64 linux/arm64; do
            scripts/verify-image-binaries.sh "${IMAGE_URI}:${SHA_TAG}" "${platform}" \
              /usr/bin/s3parcp /usr/bin/docker-credential-ecr-login
          done

      - name: summary
        env:
          IMAGE_URI: ${{ steps.publish.outputs.image_uri }}
          SHA_TAG: ${{ needs.resolve-tags.outputs.sha_tag }}
          VERSION_TAG: ${{ needs.resolve-tags.outputs.version_tag }}
          PUBLISH_LATEST: ${{ needs.resolve-tags.outputs.publish_latest }}
        run: |
          set -euo pipefail
          {
            echo "### swipe image published"
            echo
            echo "| tag | contents |"
            echo "| --- | --- |"
            echo "| \`${IMAGE_URI}:${SHA_TAG}\` | linux/amd64 + linux/arm64 |"
            if [ -n "${VERSION_TAG}" ]; then
              echo "| \`${IMAGE_URI}:${VERSION_TAG}\` | linux/amd64 + linux/arm64 |"
            fi
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              echo "| \`${IMAGE_URI}:latest\` | linux/amd64 + linux/arm64 |"
            fi
            echo
            echo "Both architectures confirmed from each child manifest's config blob."
          } >> "$GITHUB_STEP_SUMMARY"
